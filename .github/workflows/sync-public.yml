name: Sync main to public repo

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 强制覆盖公开仓库 main（仅在两边历史对不上时使用）
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-public
  cancel-in-progress: false

jobs:
  sync:
    # 本文件会随 main 一起镜像到公开仓库，加守卫避免在那边重复执行
    if: github.repository == 'OpenInzzZ/snack-box-dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PUBLIC_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: Push main to public repo
        env:
          FORCE: ${{ inputs.force }}
        run: |
          git remote add public git@github.com:OpenInzzZ/snack-box.git
          if [ "$FORCE" = "true" ]; then
            git push --force public HEAD:main
          else
            git push public HEAD:main
          fi
